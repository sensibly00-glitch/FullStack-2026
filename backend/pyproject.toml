[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "soyounglee", email = "sensibly00@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
